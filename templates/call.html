<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cuộc gọi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #202124; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: sans-serif; }
        #video-grid { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 10px; overflow-y: auto; }
        .video-container { position: relative; background: #3c4043; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; flex: 1 1 400px; max-width: 90%; max-height: 90%; display: flex; justify-content: center; align-items: center; }
        /* Nếu chỉ có 1 video (gọi 1-1) thì phóng to */
        .video-container:only-child { max-width: 100%; max-height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { transform: scaleX(-1); }
        .label { position: absolute; bottom: 10px; left: 10px; color: white; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 5px; z-index: 10; }
        .label img { width: 20px; height: 20px; border-radius: 50%; }
        #controls { height: 70px; background: #1a1a1a; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .btn { width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; color: white; background: #3c4043; transition: 0.2s; }
        .btn:hover { background: #505559; }
        .btn-danger { background: #ea4335; } .btn-danger:hover { background: #d93025; }
        .btn-off { background: #ea4335; position: relative; }
        .btn-off::after { content: '/'; position: absolute; font-size: 28px; left: 18px; top: 8px; }
    </style>
</head>
<body>
    <div id="video-grid">
        <div class="video-container" id="local-container">
            <video id="local-video" autoplay playsinline muted></video>
            <div class="label">Bạn</div>
        </div>
    </div>
    <div id="controls">
        <button class="btn" id="btn-mic" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <button class="btn" id="btn-cam" onclick="toggleCam()"><i class="fas fa-video"></i></button>
        <button class="btn btn-danger" onclick="leave()"><i class="fas fa-phone-slash"></i></button>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/socket/group_call.js') }}"></script>
</body>
</html>
