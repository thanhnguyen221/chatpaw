<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - PawTalk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="brand-section">
            <div class="logo">
                <div class="logo-icon">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="PawTalk Logo">
                </div>                
                <div class="brand-name">PawTalk</div>
            </div>
            
        </div>

        <h2>Đăng nhập</h2>

        {% if session.username %}
        <div class="welcome-message">
            <p>Xin chào, {{ session.username }}!</p>
            <a href="{{ url_for('main.logout') }}">Đăng xuất</a>
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <input type="text" name="username" placeholder="Tên đăng nhập" required>
            </div>
            
            <div class="form-group">
                <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" name="password" placeholder="Mật khẩu" required>
            </div>
            
            <button type="submit">Đăng nhập</button>
        </form>
        
        <div class="link">
            <a href="{{ url_for('main.register') }}">Chưa có tài khoản? Đăng ký ngay</a>
        </div>
    </div>
    <div class="background-animation">
        <div class="floating-shapes">
          <div class="shape"></div>
          <div class="shape"></div>
          <div class="shape"></div>
          <div class="shape"></div>
        </div>
      </div>
</body>
</html>
