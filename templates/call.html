<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cuộc gọi</title>

    <!-- Socket.IO client (global 'io' cho index.js / call.js dùng) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <!-- Font Awesome icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        #call-overlay {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* MAC STYLE: Glassmorphism header */
        .call-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .call-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .call-header .info {
            color: white;
        }

        .call-header .name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .call-header .status {
            font-size: 12px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .call-header .status-dot {
            width: 6px;
            height: 6px;
            background: #34c759;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* MAC STYLE: Audio visualizer */
        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
        }

        .audio-bar {
            width: 3px;
            background: #34c759;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        #video-grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 80px 20px 120px 20px;
            overflow-y: auto;
        }

        .video-box {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            flex: 1 1 400px;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .video-box:only-child {
            max-width: 100%;
            max-height: 90%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .env-mode {
            transform: none !important;
        }

        .user-label {
            position: absolute;
            bottom: 16px;
            left: 16px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-label img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .reaction-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
        }

        .floating-emoji {
            position: absolute;
            bottom: 0;
            font-size: 28px;
            animation: floatUp 2.5s ease-out forwards;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.3); opacity: 0; }
        }

        /* MAC STYLE: Floating glass controls */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 12px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: white;
            background: rgba(120, 120, 128, 0.24);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn:hover {
            background: rgba(120, 120, 128, 0.4);
            transform: scale(1.08);
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-danger {
            background: #ff453a;
        }

        .btn-danger:hover {
            background: #ff5e55;
        }

        .btn-off {
            background: #ff453a;
        }

        .btn.active {
            background: #34c759;
        }

        .btn.active:hover {
            background: #30d158;
        }

        /* MAC STYLE: Minimize button */
        .btn-minimize {
            background: rgba(120, 120, 128, 0.24);
            font-size: 16px;
        }

        /* Minimized call window */
        .call-minimized {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
            left: auto !important;
            top: auto !important;
            width: 320px !important;
            height: 180px !important;
            transform: none !important;
            border-radius: 20px !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5) !important;
        }

        .call-minimized #video-grid {
            padding: 10px;
        }

        .call-minimized .video-box {
            border-radius: 16px;
        }

        .call-minimized #controls {
            bottom: 10px;
            padding: 8px 16px;
            gap: 10px;
        }

        .call-minimized .btn {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        /* Expand button when minimized */
        .btn-expand {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            border: none;
            color: white;
            cursor: pointer;
            display: none;
            z-index: 101;
        }

        .call-minimized .btn-expand {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="call-overlay">
        <!-- MAC STYLE: Glassmorphism header with audio visualizer -->
        <div class="call-header" id="call-header">
            <img src="/static/img/default-avatar.png" class="avatar" id="call-avatar" alt="">
            <div class="info">
                <div class="name" id="call-name">Cuộc gọi</div>
                <div class="status">
                    <span class="status-dot"></span>
                    <span id="call-duration">00:00</span>
                </div>
            </div>
            <div class="audio-visualizer" id="audio-visualizer">
                <div class="audio-bar" style="height: 4px;"></div>
                <div class="audio-bar" style="height: 8px;"></div>
                <div class="audio-bar" style="height: 6px;"></div>
                <div class="audio-bar" style="height: 12px;"></div>
                <div class="audio-bar" style="height: 6px;"></div>
                <div class="audio-bar" style="height: 8px;"></div>
                <div class="audio-bar" style="height: 4px;"></div>
            </div>
        </div>

        <button class="btn-expand" id="btn-expand" onclick="toggleMinimize()">
            <i class="fas fa-expand"></i>
        </button>

        <div id="video-grid">
            <!-- LOCAL VIDEO -->
            <div class="video-box" id="local-box">
                <video id="local-video" autoplay playsinline muted></video>
                <div class="user-label">
                    <img src="/static/img/default-avatar.png" alt="">
                    <span>Bạn</span>
                </div>
                <div class="reaction-container"></div>
            </div>
        </div>

        <div id="controls">
            <!-- Mic -->
            <button class="btn" id="btn-mic" onclick="toggleMic()">
                <i class="fas fa-microphone"></i>
            </button>

            <!-- Cam -->
            <button class="btn" id="btn-cam" onclick="toggleCam()">
                <i class="fas fa-video"></i>
            </button>

            <!-- Flip Camera (chỉ dùng mobile, JS sẽ tự show/hide) -->
            <button class="btn" id="btn-flip" style="display: none;" onclick="flipCamera()">
                <i class="fas fa-sync-alt"></i>
            </button>

            <!-- Chia sẻ màn hình -->
            <button class="btn" id="btn-screen-share" title="Chia sẻ màn hình">
                <i class="fas fa-display"></i>
            </button>

            <!-- Thu gọn -->
            <button class="btn btn-minimize" id="btn-minimize" onclick="toggleMinimize()" title="Thu gọn">
                <i class="fas fa-compress"></i>
            </button>

            <!-- Kết thúc cuộc gọi -->
            <button class="btn btn-danger" onclick="endCall()">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <!-- Chuông gọi (call.js đang dùng) -->
    <audio id="ringtone-audio" src="/static/sounds/ringtone.mp3" preload="auto"></audio>

    <!-- Giao tiếp WebRTC + chia sẻ màn hình -->
    <script type="module" src="{{ url_for('static', filename='js/socket/call.js') }}?v=20"></script>
</body>
</html>
